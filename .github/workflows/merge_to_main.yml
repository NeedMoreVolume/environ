name: merge to main
on:
  push:
    branches:
        main

permissions: 
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - name: Setup artifact directory
        run: make init
        continue-on-error: false
      # - name: Setup localstack
      #   run: make test-setup
      - name: Run tests
        run: make test
        continue-on-error: false
  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: ncruces/go-coverage-report@v0.3.2
        with:
          report: true
          chart: true
          amend: true
